<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practice | Civil Engineering Tests</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="logo">
                <svg class="logo-mark" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <circle cx="10" cy="10" r="8.5" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M10 1.5V4M10 16V18.5M1.5 10H4M16 10H18.5" stroke="currentColor" stroke-width="1.4"/>
                </svg>
                CivilTech
            </div>

            <div class="nav-links">
                <a href="index.html">Home</a>
            </div>

        </nav>
    </header>


    <section class="quiz-section">

        <div class="quiz-container">

            <div class="quiz-header">
                <h1>Practice Questions</h1>
                <div class="quiz-progress" id="progress">Loading questions...</div>
            </div>

            <!-- Tab bar for switching between exams -->
            <div class="exam-tabs" role="tablist">
                <button class="exam-tab" data-exam="FE" role="tab">FE</button>
                <button class="exam-tab" data-exam="PE" role="tab">PE</button>
                <button class="exam-tab" data-exam="GRE" role="tab">GRE</button>
            </div>


            <div id="loadingState" class="quiz-state">
                <p>Loading questions from the server...</p>
            </div>


            <div id="errorState" class="quiz-state" style="display: none;">
                <p>
                    Couldn't load questions. Make sure the backend
                    server is running at <code id="apiUrlDisplay"></code>
                    and try refreshing this page.
                </p>
            </div>


            <div id="doneState" class="quiz-state" style="display: none;">
                <h2>You've finished this set 🎉</h2>
                <p>Switch tabs above to try another exam, or refresh to practice again.</p>
            </div>


            <div id="questionCard" class="question-card" style="display: none;">

                <div class="question-subject" id="questionSubject"></div>

                <p class="question-text" id="questionText"></p>

                <div class="choices" id="choicesList"></div>

                <button id="submitBtn" class="quiz-button" disabled>
                    Submit Answer
                </button>

                <div id="feedback" class="feedback" style="display: none;">

                    <div id="feedbackResult" class="feedback-result"></div>

                    <p id="feedbackExplanation" class="feedback-explanation"></p>

                    <button id="nextBtn" class="quiz-button">
                        Next Question →
                    </button>

                </div>

            </div>

        </div>

    </section>


    <script src="quiz.js"></script>

</body>
</html>
